name: 'setup'
description: 'Checkout, pnpm, Node 20, install deps'
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - name: install pnpm
      uses: pnpm/action-setup@v4

    - name: install node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
